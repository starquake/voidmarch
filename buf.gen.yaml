# Generated code is committed; `make proto-check` fails when it is stale.
version: v2
clean: true
plugins:
  - local: build/bin/protoc-gen-go
    out: internal/gen
    opt: paths=source_relative
  # Plain JS with .d.ts types, so no TS enums (the tsconfig allows only erasable syntax).
  - local: frontend/node_modules/.bin/protoc-gen-es
    out: frontend/src/gen
    opt:
      - target=js+dts
      - import_extension=js
