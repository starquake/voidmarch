## voidmarch development: voidmarch-development.<domain> to the voidmarch-development container on the
## web network. Needs a DNS record and an EXTRA_DOMAINS entry for `voidmarch-development.bananajuice.net`.
## SWAG's proxy.conf carries the WebSocket upgrade for /ws.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name voidmarch-development.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app voidmarch-development;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
