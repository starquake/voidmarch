## voidmarch production: voidmarch.<domain> to the voidmarch-production container on the
## web network. Needs a CNAME and a SUBDOMAINS entry for `voidmarch`.
## SWAG's proxy.conf carries the WebSocket upgrade for /ws.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name voidmarch.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app voidmarch-production;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
