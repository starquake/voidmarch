# Staging: a release candidate, pinned to the digest deploy.yml verified.
# No host port: SWAG reaches the container by name on the web network.
services:
  voidmarch-staging:
    image: ${IMAGE_NAME}@${IMAGE_DIGEST:?IMAGE_DIGEST must be set in .env}
    container_name: voidmarch-staging
    environment:
      # The web network's subnet, so REGISTER_LIMIT counts players' addresses.
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-}
    volumes:
      - voidmarch_staging_data:/data
    networks:
      - web
    # Docker's json-file log has no size limit by default.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

volumes:
  voidmarch_staging_data:
networks:
  web:
    external: true
