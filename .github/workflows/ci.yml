name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Job names are the ruleset's required checks (.github/rulesets/main.json):
# renaming one means updating the ruleset in the same PR.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # A warm build cache has produced stale lint results before.
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Read the pinned golangci-lint version
        id: golangci
        run: echo "version=$(make -s golangci-version)" >> "$GITHUB_OUTPUT"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          skip-cache: true
      - run: make lint-ascii proto-lint proto-check sqlc-check ts-check ts-lint

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # coverage badge on the badges branch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make js-check build ts-test test-coverage
      - name: Read the pinned toolchain versions
        id: toolchains
        run: echo "key=$(make -s toolchain-versions)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: build/_toolchains
          key: ${{ runner.os }}-${{ steps.toolchains.outputs.key }}
      - run: make wasm-check test-tinygo test-wasm-fallback
      - name: Check Go test coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: .testcoverage.yml
          threshold-total: 80
          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges

  e2e:
    runs-on: ubuntu-24.04
    # Microsoft's image has the browsers and their system packages, so nothing
    # is installed per run (#115). The tag is the @playwright/test version in
    # frontend/package.json. Chromium runs as uid 1001, the runner's, which
    # owns the workspace; Firefox as root, to install its sound card.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: ${{ matrix.browser == 'firefox' && '--user root --ipc=host' || '--user 1001 --ipc=host' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Headless Firefox needs an audio device before Web Audio starts; a null
      # sink is enough, and the image has no sound server. As root, PulseAudio
      # only runs in system mode, so it listens on a socket anyone may use.
      - name: Virtual sound card
        if: matrix.browser == 'firefox'
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends pulseaudio
          pulseaudio --system --daemonize --exit-idle-time=-1 -n \
            --load="module-native-protocol-unix socket=/tmp/pulse.sock auth-anonymous=1" \
            --load="module-null-sink sink_name=silent"
          for _ in $(seq 1 20); do [ -S /tmp/pulse.sock ] && break; sleep 0.5; done
          PULSE_SERVER=unix:/tmp/pulse.sock pactl info
      # Firefox refuses to run as root under another user's HOME.
      - run: ${{ matrix.browser == 'firefox' && 'HOME=/root PULSE_SERVER=unix:/tmp/pulse.sock ' || '' }}npx playwright test --project=${{ matrix.browser }}
        working-directory: frontend
        # Firefox's own output in the job log, so a crash can be diagnosed (#18).
        env:
          DEBUG: ${{ matrix.browser == 'firefox' && 'pw:browser' || '' }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 7

  # Builds and smoke-tests the image alongside the other jobs (#115), so it
  # adds nothing to the run's time; publish pushes it from main afterwards.
  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
      - name: Build date
        id: builddate
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            DATE=${{ steps.builddate.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run -d --name voidmarch -p 8080:8080 "$IMAGE"
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          docker logs voidmarch
          exit 1

  # Pushes and signs the image from main, once every check has passed. The
  # docker job above has filled the build cache, so this build is quick.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, build, e2e, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=edge,branch=main
      - name: Build date
        id: builddate
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            DATE=${{ steps.builddate.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign the image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes "{}@${DIGEST}"
