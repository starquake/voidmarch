name: Deploy

# One VPS, three environments; deployments/README.md has the server's setup.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        type: choice
        options:
          - staging
          - production
  pull_request:
    types: [labeled, synchronize]

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # CI green on a vX.Y.Z-rc.N tag deploys that release candidate; a manual run
  # deploys the release candidate tag it runs on.
  deploy-staging:
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'v') &&
        contains(github.event.workflow_run.head_branch, '-rc.')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Queued, never cancelled: a cancelled run can stop between pull and up.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Image tag
        id: tag
        env:
          REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
        run: .github/scripts/image-tag.sh staging "$REF" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Resolve and verify the image
        id: digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        run: .github/scripts/verify-image.sh "$IMAGE_REF" >> "$GITHUB_OUTPUT"
      - name: Copy the compose file
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: deployments/app/docker-compose.staging.yml
          target: ~/voidmarch-staging
          strip_components: 2
      - name: Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_DIR: voidmarch-staging
          COMPOSE_FILE: docker-compose.staging.yml
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          TRUSTED_PROXY_IPS: ${{ vars.TRUSTED_PROXY_IPS }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_DIR,COMPOSE_FILE,IMAGE_NAME,IMAGE_DIGEST,TRUSTED_PROXY_IPS
          script_path: .github/scripts/deploy-remote.sh
      - name: Health check
        run: .github/scripts/health-check.sh "${{ vars.SERVER_URL }}/healthz"

  # CI green on a v*.*.* tag deploys that release, but not a release candidate;
  # a manual run deploys :latest.
  deploy-production:
    # ci.yml pushes only main and v*.*.* tags, so a v-prefixed head_branch is a tag.
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'v') &&
        !contains(github.event.workflow_run.head_branch, '-rc.')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Image tag
        id: tag
        env:
          REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
        run: .github/scripts/image-tag.sh production "$REF" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Resolve and verify the image
        id: digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        run: .github/scripts/verify-image.sh "$IMAGE_REF" >> "$GITHUB_OUTPUT"
      - name: Copy the compose file
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: deployments/app/docker-compose.production.yml
          target: ~/voidmarch-production
          strip_components: 2
      - name: Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_DIR: voidmarch-production
          COMPOSE_FILE: docker-compose.production.yml
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          TRUSTED_PROXY_IPS: ${{ vars.TRUSTED_PROXY_IPS }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_DIR,COMPOSE_FILE,IMAGE_NAME,IMAGE_DIGEST,TRUSTED_PROXY_IPS
          script_path: .github/scripts/deploy-remote.sh
      - name: Health check
        run: .github/scripts/health-check.sh "${{ vars.SERVER_URL }}/healthz"

  # CI green on main, pushed or dispatched, deploys main's :edge; a
  # same-repository PR labeled deploy:dev builds its own image and deploys it.
  deploy-development:
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'deploy:dev') &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # One development slot: a newer deploy, from main or a PR, replaces an older one.
    concurrency:
      group: deploy-development
      cancel-in-progress: true
    environment:
      name: development
      url: ${{ vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tag
        if: github.event_name == 'workflow_run'
        id: tag
        env:
          REF: ${{ github.event.workflow_run.head_branch }}
        run: .github/scripts/image-tag.sh development "$REF" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'workflow_run'
      - name: Resolve and verify the image
        if: github.event_name == 'workflow_run'
        id: digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        run: .github/scripts/verify-image.sh "$IMAGE_REF" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build date
        if: github.event_name == 'pull_request'
        id: builddate
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Unsigned: development only runs the maintainer's own labeled PRs.
      - name: Build and push
        if: github.event_name == 'pull_request'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          build-args: |
            COMMIT=${{ github.event.pull_request.head.sha }}
            DATE=${{ steps.builddate.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Copy the compose file
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: deployments/app/docker-compose.development.yml
          target: ~/voidmarch-development
          strip_components: 2
      - name: Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_DIR: voidmarch-development
          COMPOSE_FILE: docker-compose.development.yml
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest || steps.digest.outputs.digest }}
          TRUSTED_PROXY_IPS: ${{ vars.TRUSTED_PROXY_IPS }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_DIR,COMPOSE_FILE,IMAGE_NAME,IMAGE_DIGEST,TRUSTED_PROXY_IPS
          script_path: .github/scripts/deploy-remote.sh
      - name: Health check
        run: .github/scripts/health-check.sh "${{ vars.SERVER_URL }}/healthz"
