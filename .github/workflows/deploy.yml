name: Deploy

# One VPS, three environments, each run by its own user with rootless Podman
# and a Quadlet unit from deployments/podman; deployments/README.md has the layout.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        type: choice
        options:
          - staging
          - production
          - development
  # Runs main's copy of this file, so a PR can't change the job that holds the SSH key.
  pull_request_target:
    branches: [main]
    types: [labeled, synchronize]

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # CI green on a vX.Y.Z-rc.N tag deploys that release candidate; a manual run
  # deploys the release candidate tag it runs on.
  deploy-staging:
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'v') &&
        contains(github.event.workflow_run.head_branch, '-rc.')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Queued, never cancelled: a cancelled run can stop halfway through a deploy.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Image tag
        id: tag
        env:
          REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
        run: .github/scripts/image-tag.sh staging "$REF" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Resolve and verify the image
        id: digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        run: .github/scripts/verify-image.sh "$IMAGE_REF" >> "$GITHUB_OUTPUT"
      # deploy-ssh.sh sends main's deploy.sh and unit to the environment's user
      # and runs deploy.sh there (deployments/README.md).
      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_ENV: staging
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          upload="$RUNNER_TEMP/upload"
          mkdir -p "$upload"
          cp deployments/podman/deploy.sh "deployments/podman/$DEPLOY_ENV.container" "$upload/"
          .github/scripts/deploy-ssh.sh "$upload"
      - name: Health check
        run: .github/scripts/health-check.sh "${{ vars.SERVER_URL }}/healthz"

  # CI green on a v*.*.* tag deploys that release, but not a release candidate;
  # a manual run deploys :latest. Only the repository owner starts either: a
  # dispatched or re-run CI could otherwise put an old release back.
  deploy-production:
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.triggering_actor.login == github.repository_owner &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'v') &&
        !contains(github.event.workflow_run.head_branch, '-rc.')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production' &&
        github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # head_branch is a name, not a ref: check a tag by that name points here.
      - name: Check the release tag
        if: github.event_name == 'workflow_run'
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          got="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n 1 | cut -f1)"
          if [ "$got" != "$SHA" ]; then
            echo "error: no tag $TAG at $SHA" >&2
            exit 1
          fi
      - name: Image tag
        id: tag
        env:
          REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
        run: .github/scripts/image-tag.sh production "$REF" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Resolve and verify the image
        id: digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        run: .github/scripts/verify-image.sh "$IMAGE_REF" >> "$GITHUB_OUTPUT"
      # deploy-ssh.sh sends main's deploy.sh and unit to the environment's user
      # and runs deploy.sh there (deployments/README.md).
      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_ENV: production
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          upload="$RUNNER_TEMP/upload"
          mkdir -p "$upload"
          cp deployments/podman/deploy.sh "deployments/podman/$DEPLOY_ENV.container" "$upload/"
          .github/scripts/deploy-ssh.sh "$upload"
      - name: Health check
        run: .github/scripts/health-check.sh "${{ vars.SERVER_URL }}/healthz"

  # CI green on main, pushed or dispatched, deploys main's :edge; so does a
  # manual run on main, which dispatch-after-merge.sh starts after a Dependabot merge.
  deploy-development:
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'development')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Apart from previews, never cancelled; deploy.sh's lock on the server serializes the two.
    concurrency:
      group: deploy-development
      cancel-in-progress: false
    environment:
      name: development
      url: ${{ vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A manual run on any branch but main fails here.
      - name: Image tag
        id: tag
        env:
          REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
        run: .github/scripts/image-tag.sh development "$REF" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Resolve and verify the image
        id: digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        run: .github/scripts/verify-image.sh "$IMAGE_REF" >> "$GITHUB_OUTPUT"
      # deploy-ssh.sh sends main's deploy.sh and unit to the environment's user
      # and runs deploy.sh there (deployments/README.md).
      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_ENV: development
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          upload="$RUNNER_TEMP/upload"
          mkdir -p "$upload"
          cp deployments/podman/deploy.sh "deployments/podman/$DEPLOY_ENV.container" "$upload/"
          .github/scripts/deploy-ssh.sh "$upload"
      - name: Health check
        run: .github/scripts/health-check.sh "${{ vars.SERVER_URL }}/healthz"

  # A same-repository PR labeled deploy:dev builds its own image and deploys it.
  deploy-development-preview:
    if: >-
      github.event_name == 'pull_request_target' &&
      contains(github.event.pull_request.labels.*.name, 'deploy:dev') &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy:dev') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # A newer preview replaces a pending one; main's deploys queue apart.
    concurrency:
      group: deploy-development-preview
      cancel-in-progress: false
    environment:
      name: development
      url: ${{ vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The PR's tree is only the build context: nothing in it runs on the runner or the host.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build date
        id: builddate
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Unsigned: development only runs labeled same-repository PRs.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: pr
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          build-args: |
            COMMIT=${{ github.event.pull_request.head.sha }}
            DATE=${{ steps.builddate.outputs.date }}
          # Its own scope: this runs in main's cache, which main's release build reads.
          cache-from: |
            type=gha
            type=gha,scope=preview
          cache-to: type=gha,mode=max,scope=preview
      # deploy-ssh.sh sends main's deploy.sh and unit to the environment's user
      # and runs deploy.sh there (deployments/README.md).
      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_ENV: development-preview
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          upload="$RUNNER_TEMP/upload"
          mkdir -p "$upload"
          cp deployments/podman/deploy.sh "deployments/podman/$DEPLOY_ENV.container" "$upload/"
          .github/scripts/deploy-ssh.sh "$upload"
      - name: Health check
        run: .github/scripts/health-check.sh "${{ vars.SERVER_URL }}/healthz"
