name: Dependabot auto-merge

on:
  pull_request:
  # Auto-merge merges as GITHUB_TOKEN, whose push and closed events start no
  # workflows, so the PR's green CI is the last event that reaches here.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ['dependabot/**']

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Left for Claude to merge: an actions bump waits for a code owner, and
      # merged as GITHUB_TOKEN after dispatch-after-merge.sh stops waiting it
      # would run no CI on main; a direct bump in /tools must be mirrored into
      # the Makefile's GOLANGCI_VERSION by hand.
      - name: Enable auto-merge
        if: >-
          steps.meta.outputs.package-ecosystem != 'github_actions' &&
          (steps.meta.outputs.directory != '/tools' || !startsWith(steps.meta.outputs.dependency-type, 'direct'))
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Once auto-merge lands the PR, dispatches CI on main, which publishes :edge,
  # and then Deploy for development: a dispatch is exempt from the GITHUB_TOKEN rule.
  main-after-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number
    # 10 minutes for the merge and an hour for CI, in dispatch-after-merge.sh.
    timeout-minutes: 80
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      # A workflow_run checks out main, never the PR's branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run CI on main, then deploy development
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: .github/scripts/dispatch-after-merge.sh "$PR"

# Auto-merge does not bring a branch up to date, and the ruleset requires it:
# a PR that main has moved past is rebased locally and force-pushed, which
# keeps its commits signed.
