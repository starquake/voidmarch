name: Dependabot auto-merge

on:
  pull_request:
  # Auto-merge merges as GITHUB_TOKEN, whose push and closed events start no
  # workflows, so the PR's green CI is the last event that reaches here.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ['dependabot/**']

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A direct bump in /tools must be mirrored into the Makefile's
      # GOLANGCI_VERSION by hand, so it is left for a person.
      - name: Enable auto-merge
        if: steps.meta.outputs.directory != '/tools' || !startsWith(steps.meta.outputs.dependency-type, 'direct')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dispatches CI on main once auto-merge lands the PR, which publishes :edge
  # and deploys development; workflow_dispatch is exempt from the GITHUB_TOKEN rule.
  ci-on-main:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number
    permissions:
      actions: write
      pull-requests: read
    steps:
      # A merge by a person pushes as that person, which runs CI by itself.
      - name: Wait for the merge and run CI on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          for _ in $(seq 40); do
            pr="$(gh pr view "$PR" -R "$REPO" --json state,mergedBy -q '.state + " " + ((.mergedBy.is_bot // false) | tostring)')"
            case "$pr" in
              "MERGED true")
                gh workflow run CI --ref main -R "$REPO"
                exit 0
                ;;
              MERGED* | CLOSED*) exit 0 ;;
            esac
            sleep 15
          done
          echo "#${PR} did not merge within 10 minutes"

# Auto-merge does not bring a branch up to date, and the ruleset requires it:
# a PR that main has moved past is rebased locally and force-pushed, which
# keeps its commits signed.
