// The messages between a browser and the Voidmarch server over the WebSocket
// at /ws. Frames are binary protobuf, or protobuf JSON in text frames when a
// client asks for it (?wire=json); the server answers in the format it gets.
syntax = "proto3";

package voidmarch.v1;

option go_package = "github.com/starquake/voidmarch/internal/gen/voidmarch/v1;voidmarchv1";

// Weapons from the Void Main Ship pack.
enum Weapon {
  WEAPON_UNSPECIFIED = 0;
  WEAPON_AUTO_CANNON = 1;
  WEAPON_ROCKETS = 2;
  WEAPON_BIG_SPACE_GUN = 3;
  WEAPON_ZAPPER = 4;
}

// Engines from the Void Main Ship pack.
enum Engine {
  ENGINE_UNSPECIFIED = 0;
  ENGINE_BASE = 1;
  ENGINE_BIG_PULSE = 2;
  ENGINE_BURST = 3;
  ENGINE_SUPERCHARGED = 4;
}

// Shields from the Void Main Ship pack.
enum Shield {
  SHIELD_UNSPECIFIED = 0;
  SHIELD_FRONT = 1;
  SHIELD_FRONT_AND_SIDE = 2;
  SHIELD_ROUND = 3;
  SHIELD_INVINCIBILITY = 4;
}

// Enemy classes from the Void Fleet packs.
enum EnemyKind {
  ENEMY_KIND_UNSPECIFIED = 0;
  ENEMY_KIND_SCOUT = 1;
  ENEMY_KIND_FIGHTER = 2;
  ENEMY_KIND_FRIGATE = 3;
  // The Kla'ed Dreadnought, the siege boss (#124).
  ENEMY_KIND_DREADNOUGHT = 4;
  // The later factions' slow heavy hitters (#137).
  ENEMY_KIND_BOMBER = 5;
  ENEMY_KIND_TORPEDO = 6;
  // A Support Ship repairs its pack from behind it, with no guns (#184).
  ENEMY_KIND_SUPPORT = 7;
}

// The alien fleet an enemy belongs to, one per ring (#9): the kind says how
// it fights, the faction how hard. Unset reads as the Kla'ed.
enum EnemyFaction {
  ENEMY_FACTION_UNSPECIFIED = 0;
  ENEMY_FACTION_KLAED = 1;
  ENEMY_FACTION_NAIRAN = 2;
  ENEMY_FACTION_NAUTOLAN = 3;
}

// Loadout is the part fitted in each slot, each at its tier: 0 plain, then
// Super, Mega and Hyper (#77).
message Loadout {
  Weapon weapon = 1;
  Engine engine = 2;
  Shield shield = 3;
  uint32 weapon_tier = 4;
  uint32 engine_tier = 5;
  uint32 shield_tier = 6;
}

// Part is one weapon, engine or shield (#77).
message Part {
  oneof kind {
    Weapon weapon = 1;
    Engine engine = 2;
    Shield shield = 3;
  }
}

// Unlock is a part a player owns, at its tier.
message Unlock {
  Part part = 1;
  uint32 tier = 2;
}

// ShipState is a ship as its own client simulates it; the server trusts it.
message ShipState {
  float x = 1;
  float y = 2;
  float vx = 3;
  float vy = 4;
  // Facing in radians; 0 is +x and y grows downward.
  float angle = 5;
  bool thrusting = 6;
  Loadout loadout = 7;
  // Hits taken: 0 is full health, 3 is downed.
  uint32 damage = 8;
  // Shield charges left, fractional while recharging (#46).
  float shield = 9;
  // A downed ship's revive progress, from 0 to 1 (#47).
  float revive = 10;
}

// Hello is the first message on a connection.
message Hello {
  string token = 1;
}

// ShotFired is one projectile leaving a ship; every client simulates it.
message ShotFired {
  // Unique per player, so a hit can end the shot everywhere.
  uint32 id = 1;
  Weapon weapon = 2;
  uint32 muzzle = 3;
  float x = 4;
  float y = 5;
  float angle = 6;
  // 0 for the player's own ship, n for their companion n. Only the hub sets
  // it: it fires the companions' shots (#51) and ignores a client's.
  uint32 companion = 7;
}

// Hit reports that one of the player's shots hit an enemy; the client is
// trusted for it (docs/design.md, section 9).
message Hit {
  uint32 enemy_id = 1;
  // The shot that hit, or 0 for a ram (#48).
  uint32 shot_id = 2;
  uint32 damage = 3;
  // Deprecated: the hub tests its companions' shots itself (#51); a hit with
  // a companion set is ignored.
  uint32 companion = 4 [deprecated = true];
  // The shard of the shot's burst that hit, from 1; 0 for the shot itself
  // (#72).
  uint32 shard = 5;
  // Set when a piercing shot carries on through: the hub doesn't end it.
  bool goes_on = 6;
}

// Summon asks for a companion seat (docs/design.md, section 13).
message Summon {}

// CompanionState was one of the player's companions, simulated by their
// client. Deprecated: the hub flies companions (#51) and ignores these.
message CompanionState {
  option deprecated = true;

  uint32 companion = 1;
  ShipState state = 2;
}

// ChooseSquadron joins the named squadron, or starts a new one when the name
// is empty (docs/design.md, section 13).
message ChooseSquadron {
  string name = 1;
}

// Dismiss gives a companion's seat back.
message Dismiss {
  uint32 companion = 1;
}

// ClientMessage is everything a browser sends.
message ClientMessage {
  oneof kind {
    Hello hello = 1;
    ShipState state = 2;
    ShotFired shot = 3;
    Hit hit = 4;
    Summon summon = 5;
    CompanionState companion = 6 [deprecated = true];
    Dismiss dismiss = 7;
    ChooseSquadron choose_squadron = 8;
    Collect collect = 10;
    PickMission pick_mission = 11;
    DevStartAttack dev_start_attack = 12;
    DevSeasonWon dev_season_won = 13;
    DevStartRaid dev_start_raid = 14;
    RespawnHome respawn_home = 15;
  }
  // Was squadron_order: companions took orders until #325.
  reserved 9;
  reserved "squadron_order";
}

// RespawnHome says this player, down, respawned at the home planet: the
// server docks their downed companions in the hangar, but for any with a
// squadmate up nearby to revive it (#271).
message RespawnHome {}

// DevStartRaid sends a Dreadnought raiding the hostile sector this player is
// in at once, on a development server only, for trying raids (#223).
message DevStartRaid {}

// DevStartAttack starts an attack on a cleared sector at once, on a
// development server only, for trying events and for E2E (#102).
message DevStartAttack {
  string sector = 1;
}

// DevSeasonWon asks for the season's result as if it were won now, sent to
// this player alone and winning nothing, on a development server only, for
// trying the victory screen and for E2E (#156).
message DevSeasonWon {}

// PickMission sends the player's squadron to another uncleared sector (#101).
message PickMission {
  string sector = 1;
}

// Collect says this client's ship flew over a pickup; the server decides who
// gets what (#77).
message Collect {
  uint32 id = 1;
}

// Welcome answers Hello: who you are and where to appear.
message Welcome {
  string player_id = 1;
  // The player's name color as 0xRRGGBB.
  uint32 color = 2;
  float spawn_x = 3;
  float spawn_y = 4;
  uint32 tick = 5;
  uint32 tick_rate = 6;
  // How many companions the player may have at once.
  uint32 companion_limit = 7;
  // Was summon_anywhere: development servers lifted the companion limits.
  reserved 8;
  reserved "summon_anywhere";
  // The player's name, for labeling their own companions.
  string name = 9;
  // The player's companions the server kept (a reconnect), so the client can
  // fly on with them and give back any it doesn't know.
  repeated uint32 companions = 10;
  // The squadrons to choose from.
  Squadrons squadrons = 11;
  // The player's squadron, kept on a reconnect; empty until they choose one.
  string squadron = 12;
  // The parts the player owns, at their tiers (#77).
  repeated Unlock unlocks = 13;
  // The pickups on the ground right now.
  repeated PickupDropped pickups = 14;
  // The loadout the player last fitted at home, unset for none (#78).
  Loadout loadout = 15;
  // Whether this is a development server, where the 1/2/3 keys fit any part.
  bool development = 16;
  // The cleared sectors, by name ("C3") (#99).
  repeated string cleared_sectors = 17;
  // The world event running, if any (#102).
  WorldEvent world_event = 18;
  // The game map's name ("frontier"), for the full map's title (#100).
  string map_name = 19;
  // Which sectors are open (#123).
  Frontier frontier = 20;
  // The season's result, once it's won (#156).
  SeasonWon season_won = 21;
  // The season so far (#167).
  Standings standings = 22;
}

// Standings are the season so far (#167): everyone who did anything, and
// when the season started, sent in Welcome and whenever stats change.
message Standings {
  repeated PlayerStats players = 1;
  // When the season started, in Unix seconds.
  int64 season = 2;
}

// SeasonWon is the season's result (#156): sent to everyone when the finale
// falls, and in Welcome to a player joining a won season.
message SeasonWon {
  // When the season started, in Unix seconds: it names the season, so a
  // client shows the screen once per season.
  int64 season = 1;
  // How long it took, from its start to the finale's fall, in seconds.
  uint64 seconds = 2;
  // Everyone who did anything this season.
  repeated PlayerStats players = 3;
  // How many sectors were cleared when it was won.
  uint32 sectors = 4;
}

// PlayerStats are a player's season stats (#154).
message PlayerStats {
  string player_id = 1;
  string name = 2;
  uint32 kills = 3;
  uint32 companion_kills = 4;
  uint32 shots = 5;
  uint32 hits = 6;
  uint32 deaths = 7;
  uint32 rescues = 8;
  uint32 sectors = 9;
}

// PlayerSnapshot is one other player at a tick.
message PlayerSnapshot {
  string player_id = 1;
  string name = 2;
  uint32 color = 3;
  ShipState state = 4;
  // Set for a companion: the player who owns it. Its player_id is the seat,
  // "<owner_id>/<n>", and name and color are its owner's.
  string owner_id = 5;
  // The squadron the player, or the companion's owner, flies in.
  string squadron = 6;
}

// SquadronMember is one human in a squadron, with their companions.
message SquadronMember {
  string player_id = 1;
  string name = 2;
  uint32 companions = 3;
}

// SquadronInfo is one squadron as the join screen and the HUD show it.
message SquadronInfo {
  string name = 1;
  // In the order they joined.
  repeated SquadronMember members = 2;
  // Was mode: the squadron's orders for its companions, until #325.
  reserved 3;
  reserved "mode";
  // The sector the squadron is sent to ("D5"); empty once every sector is
  // cleared (#101). Everyone sees every squadron's.
  string mission = 4;
}

// Squadrons is every squadron, and the name a new one would get. The server
// sends it on every change.
message Squadrons {
  repeated SquadronInfo squadrons = 1;
  string next_name = 2;
  // Companion ships waiting in the shared hangar, for anyone to draw.
  uint32 hangar = 3;
}

// SquadronJoined answers ChooseSquadron. Taking over a companion puts the
// player where it was.
message SquadronJoined {
  string name = 1;
  // Was mode: the squadron's orders for its companions, until #325.
  reserved 2;
  reserved "mode";
  bool took_over = 3;
  float x = 4;
  float y = 5;
}

// SquadronRefused answers ChooseSquadron when the squadron is full.
message SquadronRefused {
  string reason = 1;
}

// EnemyState is one enemy at a tick; the server moves enemies.
message EnemyState {
  uint32 enemy_id = 1;
  EnemyKind kind = 2;
  float x = 3;
  float y = 4;
  // Facing in radians; 0 is +x and y grows downward.
  float angle = 5;
  // Velocity in px/s, for the closing speed of a ram (#48).
  float vx = 6;
  float vy = 7;
  // A boss's health bar (#89); left at zero for the rest.
  float hp = 8;
  float max_hp = 9;
  // The shield's charge left, as damage it can still take.
  float shield = 10;
  // Was scaled_for: the players online its health was scaled for, shown on
  // the boss bar until #223.
  reserved 11;
  reserved "scaled_for";
  EnemyFaction faction = 12;
  // The enemy a Support Ship is repairing now (#184); 0 for none.
  uint32 repairing = 13;
  // A raiding Dreadnought's health at which it's driven off (#223); 0 for
  // any other enemy.
  float leaves_at = 14;
}

// Snapshot is every other player, and every enemy, at a server tick.
message Snapshot {
  uint32 tick = 1;
  repeated PlayerSnapshot players = 2;
  // The enemies near this player, and every boss (#231): those within
  // sim.InterestRadius of their ship or companions, kept until they're past it
  // by sim.InterestMargin.
  repeated EnemyState enemies = 3;
  // Derelict ships waiting to be rescued (#52).
  repeated DerelictState derelicts = 4;
}

// DerelictState is a derelict ship drifting where it was released, until it
// is rescued or gone_tick passes.
message DerelictState {
  uint32 derelict_id = 1;
  float x = 2;
  float y = 3;
  float angle = 4;
  // The rescue's progress, from 0 to 1.
  float rescue = 5;
  uint32 gone_tick = 6;
  // Held while enemies are near it (#114): no timer and no rescue until
  // they're gone; gone_tick counts only once it's freed.
  bool held = 7;
}

// EnemyFired is an enemy firing its pattern; every client expands the pattern
// from the seed, so bullets are never streamed. It is announced ahead: the
// weapon animates from tick - warn_ticks, and the bullets leave at tick from
// where the enemy is then. x and y are where it was when announced.
// It goes to the players who were sent the enemy in the last snapshot (#231).
message EnemyFired {
  uint32 enemy_id = 1;
  EnemyKind kind = 2;
  uint32 tick = 3;
  uint32 seed = 4;
  float x = 5;
  float y = 6;
  float angle = 7;
  // 0 for a volley with no warning of its own: a Dreadnought spiral's bursts
  // after the first, whose weapon animation plays once (#273).
  uint32 warn_ticks = 8;
  // The firing enemy's faction, which picks its bullets (#136).
  EnemyFaction faction = 9;
}

// EnemyDestroyed is an enemy shot down, at the tick and place it died. It
// goes to the players who were sent the enemy in the last snapshot (#231).
message EnemyDestroyed {
  uint32 enemy_id = 1;
  EnemyKind kind = 2;
  string by_player_id = 3;
  uint32 tick = 4;
  float x = 5;
  float y = 6;
}

// ShotEnded removes a player's shot everywhere once it hit something, at the
// server tick the hit arrived, so clients end it on their delayed timeline.
message ShotEnded {
  string player_id = 1;
  uint32 shot_id = 2;
  uint32 tick = 3;
  // The shard of the shot's burst that ended, from 1; 0 for the shot itself
  // (#72).
  uint32 shard = 4;
}

// RemoteShot is another player's shot, stamped with the server tick it arrived at.
message RemoteShot {
  string player_id = 1;
  uint32 tick = 2;
  ShotFired shot = 3;
}

// PlayerLeft says a player's ship is gone.
message PlayerLeft {
  string player_id = 1;
}

// CompanionGranted answers Summon: the companion's number and where to put it.
message CompanionGranted {
  uint32 companion = 1;
  float x = 2;
  float y = 3;
}

// CompanionRefused answers Summon when no companion can come.
message CompanionRefused {
  string reason = 1;
}

// CompanionDismissed says the server took a companion's seat back: for a
// human joining a full world, or taken over by a player joining its squadron.
message CompanionDismissed {
  uint32 companion = 1;
  // Set when a player joining the squadron took the companion over.
  string taken_by = 2;
}

// Full says the frontier has no room; the server closes the connection after it.
message Full {}

// ServerMessage is everything the server sends.
message ServerMessage {
  oneof kind {
    Welcome welcome = 1;
    Snapshot snapshot = 2;
    RemoteShot shot = 3;
    PlayerLeft left = 4;
    Full full = 5;
    EnemyFired enemy_fired = 6;
    EnemyDestroyed enemy_destroyed = 7;
    ShotEnded shot_ended = 8;
    CompanionGranted companion_granted = 9;
    CompanionRefused companion_refused = 10;
    CompanionDismissed companion_dismissed = 11;
    Squadrons squadrons = 12;
    SquadronJoined squadron_joined = 13;
    SquadronRefused squadron_refused = 14;
    PickupDropped pickup_dropped = 16;
    PickupTaken pickup_taken = 17;
    DerelictRescued derelict_rescued = 18;
    SectorCleared sector_cleared = 19;
    EventStarted event_started = 20;
    EventEnded event_ended = 21;
    Frontier frontier = 22;
    BossFell boss_fell = 23;
    SeasonWon season_won = 24;
    Standings standings = 25;
    RaidWarned raid_warned = 26;
    RaidEnded raid_ended = 27;
  }
  // Was squadron_ordered: a squadmate's order, until #325.
  reserved 15;
  reserved "squadron_ordered";
}

// RaidWarned says a Dreadnought is coming to raid a sector (#223): it
// appears there, out of sight, at tick.
message RaidWarned {
  EnemyFaction faction = 1;
  string sector = 2;
  uint32 tick = 3;
}

// RaidEnded says a raiding Dreadnought teleported out (#223): driven off by
// damage, with the parts it gave the players near it, or not. enemy_id is 0
// for a raid called off before it arrived.
message RaidEnded {
  uint32 enemy_id = 1;
  EnemyFaction faction = 2;
  bool driven_off = 3;
  repeated PickupGain gains = 4;
  uint32 tick = 5;
}

// BossFell says a siege boss was destroyed (#125): the parts it gave the
// players near it.
message BossFell {
  EnemyKind kind = 1;
  repeated PickupGain gains = 2;
  uint32 tick = 3;
  // The fallen boss's faction, which says which ring opened (#140).
  EnemyFaction faction = 4;
}

// Frontier is which sectors are open (#123): home and the rings up to
// open_rings, and any sector opened on its own, like the Dreadnought's. The
// server sends it in Welcome and again whenever it changes.
message Frontier {
  uint32 open_rings = 1;
  // Sectors open on their own, by name ("D2").
  repeated string opened = 2;
}

// PickupDropped is a part a kill left behind, collectable until gone_tick
// (#77).
message PickupDropped {
  uint32 id = 1;
  Part part = 2;
  float x = 3;
  float y = 4;
  // The tick it dropped at and the tick it's gone at.
  uint32 tick = 5;
  uint32 gone_tick = 6;
}

// PickupTaken is a pickup collected: gone from the world, and a part gained
// by the collector's squadmates.
message PickupTaken {
  uint32 id = 1;
  // Who flew over it.
  string player_id = 2;
  repeated PickupGain gains = 3;
}

// WorldEventKind is what a world event is (#102).
enum WorldEventKind {
  WORLD_EVENT_KIND_UNSPECIFIED = 0;
  // An attack on a cleared sector: beat it before ends_tick or lose the sector.
  WORLD_EVENT_KIND_ATTACK = 1;
  // A derelict's distress call: rescue it before ends_tick.
  WORLD_EVENT_KIND_DISTRESS = 2;
}

// WorldEvent is a short shared goal somewhere on the map (#102).
message WorldEvent {
  WorldEventKind kind = 1;
  string sector = 2;
  uint32 ends_tick = 3;
}

// EventStarted is a world event beginning; everyone is told.
message EventStarted {
  WorldEvent event = 1;
  // Set when the event already running changed, like a distress call whose
  // derelict was freed and now ends sooner or later (#114): no new banner.
  bool ongoing = 2;
}

// EventEnded is a world event over, won or lost.
message EventEnded {
  WorldEvent event = 1;
  bool won = 2;
}

// SectorCleared is a sector whose garrison is destroyed, and its boss if it
// has one (#99).
message SectorCleared {
  string sector = 1;
  uint32 tick = 2;
  // The parts it gave every player online (#101).
  repeated PickupGain gains = 3;
  // What each player who fought in it did there, from when they first came
  // in until it was cleared (#167).
  repeated PlayerStats mission = 4;
}

// DerelictRescued is a derelict docked in the hangar (#52).
message DerelictRescued {
  uint32 derelict_id = 1;
  // The player who finished the rescue, or whose companion did.
  string player_id = 2;
  uint32 tick = 3;
  // The hangar's ships after it docked.
  uint32 hangar = 4;
  // Whether it joined the hangar: not with the fleet full, though the rescue
  // still counts (@starquake, 2026-10-01).
  bool docked = 5;
}

// PickupGain is one player's new tier of a part (0 when newly unlocked).
message PickupGain {
  string player_id = 1;
  Unlock unlock = 2;
}
