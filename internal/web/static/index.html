<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voidmarch</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/css/style.css">
    <script type="module" src="/static/js/main.js"></script>
  </head>
  <body>
    <main id="game"></main>
    <form id="name-form" class="name-screen" novalidate hidden>
      <h1>Voidmarch</h1>
      <label for="name">Pick a name</label>
      <input id="name" name="name" maxlength="16" autocomplete="nickname" spellcheck="false" autocapitalize="off" required>
      <p id="name-error" class="name-error" role="alert"></p>
      <button type="submit">Play</button>
      <button id="play-alone" type="button" hidden>Play alone</button>
    </form>
  </body>
</html>
